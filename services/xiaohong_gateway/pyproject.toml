[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaohong-gateway"
version = "0.1.0"
description = "Protocol-isolation gateway core for XiaoHong devices and XiaoZhi services"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["."]
include = ["xiaohong_gateway*"]
